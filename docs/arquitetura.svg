<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#333"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="24" text-anchor="middle" font-size="20" font-weight="700" fill="#222">Arquitetura simplificada — NucleAR Quiz API (Challenge DevOps Tools &amp; Cloud Computing)</text>

  <!-- ===== Microsoft Azure ===== -->
  <rect x="270" y="40" width="905" height="660" rx="10" fill="#F3F9FE" stroke="#0078D4" stroke-width="3"/>
  <text x="285" y="64" font-size="16" font-weight="700" fill="#0078D4">Microsoft Azure — Região East US</text>

  <rect x="295" y="80" width="855" height="605" rx="8" fill="none" stroke="#0078D4" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="308" y="102" font-size="14" font-weight="600" fill="#0078D4">Resource Group: rg-nuclear-quiz</text>

  <rect x="320" y="115" width="810" height="555" rx="8" fill="#FFFFFF" stroke="#59B4D9" stroke-width="2"/>
  <text x="333" y="137" font-size="14" font-weight="600" fill="#2A7FA8">Virtual Network: vnet-nuclear-quiz</text>

  <!-- Public IP -->
  <g transform="translate(345,290)">
    <rect width="150" height="100" rx="8" fill="#E6F2FB" stroke="#0078D4" stroke-width="2"/>
    <circle cx="75" cy="30" r="18" fill="none" stroke="#0078D4" stroke-width="3"/>
    <ellipse cx="75" cy="30" rx="8" ry="18" fill="none" stroke="#0078D4" stroke-width="2"/>
    <line x1="57" y1="30" x2="93" y2="30" stroke="#0078D4" stroke-width="2"/>
    <text x="75" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#003E73">Public IP Address</text>
    <text x="75" y="85" text-anchor="middle" font-size="12" fill="#333">pip-nuclear-quiz</text>
  </g>

  <!-- NSG -->
  <g transform="translate(545,290)">
    <rect width="150" height="100" rx="8" fill="#E6F2FB" stroke="#0078D4" stroke-width="2"/>
    <path d="M75,10 L97,18 L97,34 Q97,50 75,58 Q53,50 53,34 L53,18 Z" fill="#0078D4"/>
    <path d="M65,33 L73,41 L86,26" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="75" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#003E73">Network Security Group</text>
    <text x="75" y="91" text-anchor="middle" font-size="12" fill="#333">nsg-nuclear-quiz (22, 80)</text>
  </g>

  <!-- VM -->
  <rect x="745" y="160" width="370" height="490" rx="10" fill="#E6F2FB" stroke="#0078D4" stroke-width="3"/>
  <g transform="translate(762,172)">
    <rect x="0" y="0" width="34" height="24" rx="3" fill="#0078D4"/>
    <rect x="4" y="4" width="26" height="16" fill="#9ED3F5"/>
    <rect x="12" y="26" width="10" height="4" fill="#0078D4"/>
    <rect x="6" y="30" width="22" height="3" fill="#0078D4"/>
  </g>
  <text x="806" y="188" font-size="14" font-weight="700" fill="#003E73">Azure Virtual Machine — vm-nuclear-quiz</text>
  <text x="806" y="205" font-size="12" fill="#333">Ubuntu 24.04 LTS • Standard_B2s • usuário admlnx</text>

  <!-- Docker Engine -->
  <rect x="765" y="225" width="330" height="405" rx="8" fill="#FFFFFF" stroke="#2496ED" stroke-width="2.5"/>
  <g transform="translate(780,235)">
    <path d="M0,22 H40 Q42,34 32,40 Q18,46 6,38 Q0,32 0,22 Z" fill="#2496ED"/>
    <rect x="4" y="12" width="7" height="7" fill="#2496ED"/><rect x="13" y="12" width="7" height="7" fill="#2496ED"/>
    <rect x="22" y="12" width="7" height="7" fill="#2496ED"/><rect x="13" y="3" width="7" height="7" fill="#2496ED"/>
  </g>
  <text x="832" y="258" font-size="14" font-weight="700" fill="#0B5FA5">Docker Engine</text>

  <!-- Container -->
  <g transform="translate(790,282)">
    <rect width="280" height="175" rx="8" fill="#E8F7EC" stroke="#2E9E50" stroke-width="2.5"/>
    <rect x="12" y="12" width="26" height="26" rx="3" fill="none" stroke="#2E9E50" stroke-width="3"/>
    <line x1="25" y1="12" x2="25" y2="38" stroke="#2E9E50" stroke-width="2"/>
    <text x="48" y="30" font-size="14" font-weight="700" fill="#1E6B35">Container: nuclear-quiz-api</text>
    <text x="14" y="58" font-size="12" fill="#333">Spring Boot 3.5 • Java 17 • porta 8080</text>
    <text x="14" y="75" font-size="12" fill="#333">/api/perguntas • /api/competicoes</text>
    <text x="14" y="92" font-size="12" fill="#333">Swagger UI: /swagger-ui/index.html</text>
    <rect x="14" y="108" width="252" height="52" rx="6" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="1.5"/>
    <ellipse cx="38" cy="126" rx="13" ry="5" fill="#8A8A8A"/>
    <path d="M25,126 V144 Q25,150 38,150 Q51,150 51,144 V126" fill="#B5B5B5"/>
    <text x="64" y="130" font-size="13" font-weight="700" fill="#444">Banco H2 (em memória)</text>
    <text x="64" y="147" font-size="11" fill="#444">JPA/Hibernate • data.sql</text>
  </g>

  <!-- Imagem -->
  <g transform="translate(790,495)">
    <rect width="280" height="80" rx="8" fill="#EAF4FE" stroke="#2496ED" stroke-width="2"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#0B5FA5">Imagem Docker: nuclear-quiz-api</text>
    <text x="14" y="46" font-size="12" fill="#333">Dockerfile multi-stage (Maven → JRE 17)</text>
    <text x="14" y="64" font-size="12" fill="#333">Gerada com docker build</text>
  </g>
  <line x1="930" y1="495" x2="930" y2="459" stroke="#2496ED" stroke-width="2" marker-end="url(#seta)"/>
  <text x="938" y="482" font-size="11" fill="#0B5FA5">docker run</text>

  <!-- ===== Lado esquerdo ===== -->
  <!-- Desenvolvedor -->
  <g transform="translate(30,60)">
    <rect width="200" height="90" rx="8" fill="#FFF" stroke="#555" stroke-width="2"/>
    <rect x="14" y="16" width="38" height="26" rx="3" fill="#555"/><rect x="18" y="20" width="30" height="18" fill="#C9D6E2"/>
    <rect x="8" y="44" width="50" height="5" rx="2" fill="#555"/>
    <text x="66" y="34" font-size="14" font-weight="700" fill="#222">Desenvolvedor</text>
    <text x="66" y="52" font-size="12" fill="#333">Cloud Shell / terminal</text>
    <text x="14" y="76" font-size="12" fill="#333">executa os scripts .sh</text>
  </g>

  <!-- Azure CLI -->
  <g transform="translate(30,200)">
    <rect width="200" height="90" rx="8" fill="#E6F2FB" stroke="#0078D4" stroke-width="2"/>
    <rect x="12" y="14" width="40" height="30" rx="3" fill="#1b1b1b"/>
    <text x="17" y="34" font-size="14" font-family="monospace" fill="#5CE15C">&gt;_</text>
    <text x="62" y="30" font-size="14" font-weight="700" fill="#003E73">Azure CLI</text>
    <text x="62" y="47" font-size="12" fill="#333">deploy-challenge.sh</text>
    <text x="14" y="76" font-size="12" fill="#333">az group create / az vm create</text>
  </g>
  <line x1="130" y1="150" x2="130" y2="198" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>

  <!-- GitHub -->
  <g transform="translate(30,380)">
    <rect width="200" height="90" rx="8" fill="#FFF" stroke="#24292f" stroke-width="2"/>
    <circle cx="32" cy="30" r="17" fill="#24292f"/>
    <path d="M24,26 L27,20 L32,24 L37,20 L40,26 Q42,36 32,40 Q22,36 24,26 Z" fill="#fff"/>
    <text x="58" y="30" font-size="14" font-weight="700" fill="#24292f">GitHub</text>
    <text x="58" y="47" font-size="12" fill="#333">repositório da API</text>
    <text x="14" y="76" font-size="12" fill="#333">Dockerfile • src • scripts</text>
  </g>

  <!-- Usuário -->
  <g transform="translate(30,580)">
    <rect width="200" height="90" rx="8" fill="#FFF" stroke="#555" stroke-width="2"/>
    <circle cx="32" cy="26" r="9" fill="#555"/><path d="M14,52 Q32,30 50,52 Z" fill="#555"/>
    <text x="64" y="30" font-size="14" font-weight="700" fill="#222">Usuário / Cliente</text>
    <text x="64" y="47" font-size="12" fill="#333">navegador ou curl</text>
    <text x="14" y="76" font-size="12" fill="#333">http://IP-PUBLICO/api/...</text>
  </g>

  <!-- ===== Setas ===== -->
  <!-- Azure CLI -> Resource Group -->
  <line x1="230" y1="245" x2="294" y2="245" stroke="#0078D4" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="236" y="234" font-size="11" fill="#0078D4">provisiona</text>

  <!-- Usuário -> Public IP -->
  <path d="M230,625 H420 V392" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="250" y="617" font-size="12" font-weight="600" fill="#333">HTTP :80</text>

  <!-- Public IP -> NSG -> Container -->
  <line x1="495" y1="340" x2="544" y2="340" stroke="#333" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="695" y1="340" x2="789" y2="340" stroke="#333" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="700" y="326" font-size="11" font-weight="600" fill="#333">porta 80 → 8080</text>

  <!-- GitHub -> VM -->
  <path d="M230,425 H745" fill="none" stroke="#24292f" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#seta)"/>
  <text x="520" y="445" font-size="12" fill="#24292f">git clone (dentro da VM, via SSH)</text>
</svg>
